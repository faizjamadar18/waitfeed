name: Feature request
description: Suggest an idea or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that WaitFeed doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Which host does this touch?
      multiple: true
      options:
        - OpenCode
        - Claude Code
        - Google Antigravity (AGY)
        - The `waitfeed` CLI
        - New host
        - Not host-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought about solving this.
    validations:
      required: false
