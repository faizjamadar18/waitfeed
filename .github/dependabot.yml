version: 2
updates:
  # Dev harness at the repo root (vitest, tsc, esbuild).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The published package. Dependencies are EXACT-pinned and bumped
  # deliberately at release time — read the diff, don't merge blindly.
  - package-ecosystem: npm
    directory: /packages/waitfeed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The Next.js landing page.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # Keep the CI actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
